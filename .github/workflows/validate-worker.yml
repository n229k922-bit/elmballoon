name: Validate integrated systems

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  worker-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Worker syntax
        run: node --check workers/admin-line-secretary/src/index.js
      - name: Validate manager and legacy behavior
        run: |
          node tools/test-order-record-workflow.mjs
          node tools/test-conversation-planner.mjs
          node tools/test-calendar-security.mjs
          node tools/test-manager-mobile.mjs
          node tools/test-manager-intake.mjs
          node tools/test-manager-history.mjs
          node tools/test-capacity-safety.mjs
          node tools/test-operational-metrics.mjs
          node tools/test-manager-freshness.mjs
          node tools/test-manager-safety-ui.mjs
          node tools/test-manager-friendly-console.mjs
          node tools/test-site-dialogue.mjs
          node tools/test-ai-disclosure.mjs
          node tools/test-line-e2e.mjs
          node tools/test-schedule-proof.mjs
          node --test tools/test-manager-runtime.mjs tools/test-order-knowledge-import.mjs
      - name: Check required integration routes
        shell: bash
        run: |
          grep -q "'/webhook/line'" workers/admin-line-secretary/src/index.js
          grep -q "'/webhook/customer-line'" workers/admin-line-secretary/src/index.js
          grep -q "'/api/business-schedule'" workers/admin-line-secretary/src/index.js
          grep -q "function publicSchedule" workers/admin-line-secretary/src/index.js
          grep -q "business-schedule" dist/index.html
