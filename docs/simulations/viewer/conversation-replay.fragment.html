 function render(){const c=cases.find(x=>x.id===select.value)||cases[0];thread.replaceChildren();root.querySelector('[data-persona]').textContent=`${c.recipient}／${c.persona.interactionStyle}`;
 root.querySelector('[data-notice]').textContent=mode.value==='roles'?'エージェント役の合成会話。目指す応対の提案であり、現行コードの実出力ではありません。店長判断は4往復後に受け渡しています。':'2026年10月16日の修正前ローカル検証。実LINE送信ではありません。店長役の判断は入力していません。';
 if(mode.value==='roles'){c.turns.forEach((t,i)=>{step(`${i+1}往復目`);add('お客様役',t,'customer');add('注文担当役',c.clerk[i],'staff');});step('店長への確認と判断');if(c.manager.length)c.manager.forEach(m=>add('店長役',m.decision+'\n\n'+m.next,'manager','未確定事項を含む'));else add('店長役','新たな判断依頼なし。写真待ち・相談終了などの状態を維持します。','manager');add('注文担当役',c.after,'staff','店長判断を受けた返答');}
 else c.actual.forEach((a,i)=>{step(i===4?'返答を見た顧客役による追加の訂正':`${i+1}往復目`);add('お客様役',a.text,'customer');add('コードの返答案',a.reply,'staff',({pending:'承認待ち・未送信',approved:'模擬送信待ち',sent:'模擬送信記録',stale:'旧版',held:'保留'})[a.status]||a.status||'案なし');});
 const review=root.querySelector('[data-review]');review.replaceChildren();const ul=document.createElement('ul');c.expect.forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.append(li)});review.append(ul);const p=document.createElement('p');p.textContent='顧客役による修正前の評価：'+c.review.problem;review.append(p);
 }
 function change(){render();window.openai?.setWidgetState?.({modelContent:{caseId:select.value,mode:mode.value},privateContent:null})?.catch(()=>{});}
 select.addEventListener('change',change);mode.addEventListener('change',change);
 window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;if(s&&cases.some(c=>c.id===s.caseId)){select.value=s.caseId;mode.value=s.mode==='runtime'?'runtime':'roles';render();}});
 render();
})();
</script>
