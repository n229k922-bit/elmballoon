name = "elm-balloon-admin-line-secretary"
main = "src/index.js"
compatibility_date = "2026-09-21"

# Replace the placeholder IDs after creating the resources in Cloudflare.
[[d1_databases]]
binding = "DB"
database_name = "elm-balloon-schedule"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SECRETARY_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Comma-separated origins. Do not add elmballoon.com until test approval.
ALLOWED_ORIGINS = ""
ADMIN_LINE_USER_IDS = ""

# Set these with `wrangler secret put`; never commit their values:
# LINE_CHANNEL_SECRET
# LINE_CHANNEL_ACCESS_TOKEN
